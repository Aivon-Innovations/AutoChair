; =============================================================================
; AutoChair Standalone Pi <-> ESP32 Serial Communication Test Firmware
; Platform: ESP32 DevKit (ESP32-WROOM-32 / 32D)
; =============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -DSTANDALONE_SERIAL_TEST=1
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
