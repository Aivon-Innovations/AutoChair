; =============================================================================
; AutoChair ESP32 Firmware — PlatformIO Configuration
; Project: Aivon Innovations — AutoChair
; Platform: ESP32-WROOM-32D DevKit
; Status: IN DEVELOPMENT
; =============================================================================

[platformio]
default_envs = esp32dev

; ─── Shared settings ─────────────────────────────────────────────────────────
[env]
build_flags =
    -DAUTOCHAIR_FIRMWARE_VERSION=\"0.1.0\"
    -DAUTOCHAIR_PROTOCOL_VERSION=1
    -std=gnu++17
build_unflags = -std=gnu++11

; ─── Target hardware: ESP32-WROOM-32D DevKit ─────────────────────────────────
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; Source directories (PlatformIO will compile everything under src/)
; Additional include paths
build_flags =
    ${env.build_flags}
    -Iinclude
    -Isrc
    -DENV_ESP32
    -DAUTOCHAIR_SIMULATION_MODE=0

; ─── Native unit-test environment (host machine, no hardware required) ────────
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DENV_NATIVE
    -DAUTOCHAIR_SIMULATION_MODE=1
    -Iinclude
    -Isrc
test_build_src = yes
