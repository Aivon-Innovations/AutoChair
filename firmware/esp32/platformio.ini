; =============================================================================
; AutoChair — firmware/esp32 — PlatformIO build configuration
;
; Project:  Aivon Innovations — AutoChair
; Platform: ESP32-WROOM-32D
; Branch:   alvira-dev
;
; Environments:
;   native_test — host machine, runs Unity test suite without hardware
;   esp32dev    — uploads to ESP32-WROOM-32D, 115200 baud upload
;
; Run tests:     pio test -e native_test
; Build ESP32:   pio run  -e esp32dev
; Upload ESP32:  pio run  -e esp32dev --target upload
; =============================================================================

[platformio]
default_envs = native_test

; ---------------------------------------------------------------------------
; Shared settings inherited by all environments
; ---------------------------------------------------------------------------
[env]
build_flags =
    -std=c++14
    -Wall
    -Wextra
src_filter =
    +<**/*.cpp>
    -<main.cpp>

; ---------------------------------------------------------------------------
; Native test environment — no ESP32 hardware required
; ---------------------------------------------------------------------------
[env:native_test]
platform     = native
test_framework = unity
build_flags  =
    ${env.build_flags}
    -DENV_NATIVE
    -I include
    -I src
    -I test
src_filter   =
    +<sensors/ultrasonic/obstacle_zone.cpp>
    +<sensors/ultrasonic/hcsr04_driver.cpp>
    +<sensors/ultrasonic/ultrasonic_manager.cpp>

; ---------------------------------------------------------------------------
; ESP32 hardware environment
; ---------------------------------------------------------------------------
[env:esp32dev]
platform       = espressif32
board          = esp32dev
framework      = arduino
monitor_speed  = 115200
upload_speed   = 115200
build_flags    =
    ${env.build_flags}
lib_deps       =
src_filter     =
    +<**/*.cpp>
